buildscript {
    ext {
        // API 36 (Android 16): a Google Play exige para enviar versões novas
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // React Native 0.77: NDK 27 e Kotlin 2.0 (bibliotecas nativas em páginas de 16 KB)
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Google Play: as bibliotecas nativas compiladas aqui (ex.: MMKV, em C++) também saem
// prontas para celulares com páginas de memória de 16 KB (Android 15+). As do React
// Native já vêm assim do 0.77.
// (Assim que o plugin de biblioteca Android entra: o React Native avalia o app antes
// dos outros projetos, e um afterEvaluate aqui chegaria tarde demais.)
subprojects { sub ->
    sub.plugins.withId("com.android.library") {
        sub.android.defaultConfig.externalNativeBuild.cmake.arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
    }
}
