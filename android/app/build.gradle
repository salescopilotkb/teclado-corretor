apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // namespace = pacote do código Kotlin (nome antigo, só interno);
    // applicationId = identidade do app na Google Play (não muda depois de publicar)
    namespace "com.corretorkeyboard"
    defaultConfig {
        applicationId "com.keycon.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Versão calculada a cada commit por scripts/write_build_info.js (a CI exporta;
        // fora dela, o número do build do GitHub Actions ou 1.0.0)
        versionCode((System.getenv("KEYCON_VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName(System.getenv("KEYCON_VERSION_NAME") ?: ("1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")))
    }
    // Chave de envio da Google Play: a CI recebe dos segredos do GitHub
    // (KEYCON_UPLOAD_*). Sem ela, o AAB sai com a chave de debug e a Play recusa.
    def uploadStoreFile = System.getenv("KEYCON_UPLOAD_STORE_FILE")
    def hasUploadKey = uploadStoreFile && file(uploadStoreFile).exists()

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            upload {
                storeFile file(uploadStoreFile)
                storePassword System.getenv("KEYCON_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("KEYCON_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("KEYCON_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasUploadKey ? signingConfigs.upload : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    // FileProvider e envio de imagens pelo teclado (EditorInfoCompat / InputConnectionCompat)
    implementation("androidx.core:core:1.9.0")
    // Tradução no próprio aparelho (botão "Traduzir" do teclado): Google ML Kit, sem chave de API
    implementation("com.google.mlkit:translate:17.0.3")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
