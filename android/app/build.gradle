apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

react {
    // Expo SDK 54: o bundle JS sai pelo Expo CLI (export:embed), que usa o metro.config.js do Expo
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Autolinking */
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // namespace = pacote do código Kotlin (nome antigo, só interno);
    // applicationId = identidade do app na Google Play (não muda depois de publicar)
    namespace "com.corretorkeyboard"
    defaultConfig {
        applicationId "com.keycon.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Versão calculada a cada commit por scripts/write_build_info.js (a CI exporta;
        // fora dela, o número do build do GitHub Actions ou 1.0.0)
        versionCode((System.getenv("KEYCON_VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName(System.getenv("KEYCON_VERSION_NAME") ?: ("1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")))
        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    // Chave de envio da Google Play: a CI recebe dos segredos do GitHub
    // (KEYCON_UPLOAD_*). Sem ela, o AAB sai com a chave de debug e a Play recusa.
    def uploadStoreFile = System.getenv("KEYCON_UPLOAD_STORE_FILE")
    def hasUploadKey = uploadStoreFile && file(uploadStoreFile).exists()

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            upload {
                storeFile file(uploadStoreFile)
                storePassword System.getenv("KEYCON_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("KEYCON_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("KEYCON_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasUploadKey ? signingConfigs.upload : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    // FileProvider e envio de imagens pelo teclado (EditorInfoCompat / InputConnectionCompat)
    implementation("androidx.core:core:1.9.0")
    // Tradução no próprio aparelho (botão "Traduzir" do teclado): Google ML Kit, sem chave de API
    implementation("com.google.mlkit:translate:17.0.3")
    // Sugestões do preenchimento automático (e-mails, endereços) na faixa do teclado, como no Gboard (Android 11+)
    implementation("androidx.autofill:autofill:1.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

