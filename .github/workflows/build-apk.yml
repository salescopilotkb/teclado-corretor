name: Build KEYCON APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          # Histórico completo: a versão do app é o número de commits
          fetch-depth: 0

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependências NPM
        run: npm ci

      - name: Configurar Java 17 (Exigido pelo React Native 0.74 e AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Permissão de execução para o Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Versão do app (a cada commit)
        run: node scripts/write_build_info.js --github-env

      - name: Gerar Bundle JS do React Native
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Compilar APK de Debug
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ../build.log

      - name: Exibir detalhes do erro se falhar
        if: failure()
        run: |
          echo "=========================================="
          echo "ULTIMAS 150 LINHAS DO LOG DE COMPILACAO:"
          echo "=========================================="
          tail -n 150 build.log

      - name: Salvar Log de Erro como Artefato
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Renomear APK para KEYCON
        if: success()
        run: mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/KEYCON-v${{ env.KEYCON_VERSION_NAME }}.apk"

      - name: Salvar APK como Artefato de Download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KEYCON-v${{ env.KEYCON_VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/KEYCON-v${{ env.KEYCON_VERSION_NAME }}.apk
