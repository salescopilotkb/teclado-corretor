name: Build KEYCON iOS

# Compila o app do iPhone (com o teclado) a cada commit, junto com o AAB do Android.
# Sem conta Apple Developer ainda: compila para iPhone (arm64), sem assinatura.
# Serve para saber se o código iOS compila; para instalar num iPhone é
# preciso assinar com a conta da Apple (DEVELOPMENT_TEAM em ios/project.yml).

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    # Mac Intel: nas máquinas Mac arm64 (macos-14 e macos-15) o GitHub ficava sem
    # máquina livre e cancelava a compilação sem rodar. O passo "Selecionar Xcode"
    # continua escolhendo o 16.2, que o RN 0.74 aceita
    runs-on: macos-15-intel
    # Fila longa quando faltam máquinas Mac no GitHub: desiste depois de 1 h
    timeout-minutes: 60

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          # Histórico completo: a versão do app é o número de commits
          fetch-depth: 0

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependências NPM
        run: npm ci

      - name: Versão do app (a cada commit)
        run: node scripts/write_build_info.js --github-env

      # React Native 0.74 compila no Xcode 15.4 e no 16 até o 16.2 (o 16.3 quebra o fmt)
      - name: Selecionar Xcode
        run: |
          for v in 15.4 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version

      - name: Gerar projeto Xcode (XcodeGen)
        working-directory: ios
        # Versão fixa: as mais novas geram o projeto num formato que o Xcode 15 não abre
        run: |
          curl -sSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          BIN=$(dirname "$(find /tmp/xcodegen -type f -name xcodegen -perm -u+x | head -n 1)")
          export PATH="$BIN:$PATH"
          echo "$BIN" >> "$GITHUB_PATH"
          xcodegen --version
          # Fonte Inter do Android para ios/Fonts (o project.yml também faz, no preGenCommand)
          mkdir -p Fonts && cp ../android/app/src/main/assets/fonts/*.otf Fonts/
          xcodegen generate

      - name: Instalar Pods
        working-directory: ios
        run: |
          pod --version
          pod install

      # O scheme compartilhado vem do XcodeGen (ios/project.yml). Se ele não chegar ao
      # workspace, cria aqui com o xcodeproj (vem com o CocoaPods): app + teclado.
      - name: Conferir o scheme CorretorKeyboard
        working-directory: ios
        run: |
          # Diagnóstico também no resumo público da compilação
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') | XcodeGen $(xcodegen --version) | $(grep -m1 objectVersion CorretorKeyboard.xcodeproj/project.pbxproj | tr -d '\t;')"
          echo "::notice::schemes: $(ls CorretorKeyboard.xcodeproj/xcshareddata/xcschemes 2>/dev/null | tr '\n' ' ')"
          ls -la CorretorKeyboard.xcodeproj/xcshareddata/xcschemes 2>/dev/null || echo "sem xcshareddata/xcschemes"
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("CorretorKeyboard.xcodeproj")
            path = File.join(Xcodeproj::XCScheme.shared_data_dir(project.path), "CorretorKeyboard.xcscheme")
            if File.exist?(path)
              puts "scheme ok: #{path}"
            else
              app = project.targets.find { |t| t.name == "CorretorKeyboard" }
              ext = project.targets.find { |t| t.name == "CorretorKeyboardExtension" }
              abort "alvos não encontrados: #{project.targets.map(&:name)}" unless app && ext
              scheme = Xcodeproj::XCScheme.new
              scheme.add_build_target(ext)
              scheme.add_build_target(app)
              scheme.set_launch_target(app)
              scheme.save_as(project.path, "CorretorKeyboard", true)
              puts "scheme criado: #{path}"
            end
          '
          xcodebuild -list -workspace CorretorKeyboard.xcworkspace 2>&1 | tee list.txt
          echo "::notice::xcodebuild -list: $(tr '\n' ' ' < list.txt | tr -s ' ' | cut -c1-900)"

      - name: Compilar app e teclado (iPhone, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/CorretorKeyboard.xcworkspace \
            -scheme CorretorKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$KEYCON_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$KEYCON_VERSION_CODE" \
            build 2>&1 | tee build-ios.log

      - name: Exibir detalhes do erro se falhar
        if: failure()
        run: |
          echo "=========================================="
          echo "ERROS DA COMPILACAO:"
          echo "=========================================="
          grep -E "error:|fatal error|\*\* BUILD FAILED" build-ios.log | head -n 60 || true
          # Os erros também viram avisos no resumo público da compilação (dá para ler sem login)
          grep -E "error:|fatal error" build-ios.log | sort -u | head -n 25 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done || true
          echo "=========================================="
          echo "ULTIMAS 150 LINHAS DO LOG:"
          echo "=========================================="
          tail -n 150 build-ios.log || true

      - name: Salvar Log de Erro como Artefato
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build-ios.log

      - name: Conferir o teclado dentro do app
        if: success()
        run: |
          APP=ios/build/Build/Products/Release-iphoneos/CorretorKeyboard.app
          ls "$APP/PlugIns/CorretorKeyboardExtension.appex"
          ls -la "$APP/main.jsbundle" "$APP/PlugIns/CorretorKeyboardExtension.appex/main.jsbundle"

      # .ipa (o formato de instalação do iPhone: Payload/CorretorKeyboard.app compactado).
      # Ainda sem assinatura: só instala depois de assinado com uma conta da Apple
      # (Xcode, Sideloadly/AltStore com o Apple ID, ou a conta Apple Developer para TestFlight).
      - name: Gerar .ipa (sem assinatura)
        if: success()
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/CorretorKeyboard.app ipa/Payload/
          cd ipa
          zip -qry "$GITHUB_WORKSPACE/KEYCON-iOS-sem-assinatura-v${{ env.KEYCON_VERSION_NAME }}.ipa" Payload
          echo "::notice::KEYCON-iOS-sem-assinatura-v${{ env.KEYCON_VERSION_NAME }}.ipa gerado (sem assinatura)"

      - name: Salvar .ipa como Artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KEYCON-iOS-sem-assinatura-v${{ env.KEYCON_VERSION_NAME }}-ipa
          path: KEYCON-iOS-sem-assinatura-v${{ env.KEYCON_VERSION_NAME }}.ipa
