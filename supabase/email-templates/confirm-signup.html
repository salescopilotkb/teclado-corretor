<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>KEYCON: confirm your email</title>
</head>
<body style="margin:0;padding:0;background-color:#f17860;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f17860" style="background-color:#f17860;background-image:linear-gradient(135deg,#f58a6f 0%,#f17860 45%,#e2654d 100%);">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
        <!-- Logo -->
        <tr>
          <td align="center" bgcolor="#242833" style="background-color:#242833;border-radius:20px 20px 0 0;padding:28px 24px;">
            <img src="https://keyconapp.com/img/logo-keycon.png" width="180" height="38" alt="KEYCON" style="display:block;border:0;width:180px;height:auto;">
          </td>
        </tr>
        <!-- Card -->
        <tr>
          <td bgcolor="#ffffff" style="background-color:#ffffff;border-radius:0 0 20px 20px;padding:36px 32px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1b1e26;">
            <p style="margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#b44a35;">Welcome to KEYCON</p>
            <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;font-weight:800;color:#1b1e26;">Confirm your email</h1>
            <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#5b6271;">Thanks for signing up! Tap the button below to confirm your email address and start using KEYCON.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#e2654d" style="border-radius:999px;background-color:#e2654d;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 34px;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:999px;">Confirm my email</a>
                </td>
              </tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:28px;">
              <tr>
                <td bgcolor="#f4f6fa" style="background-color:#f4f6fa;border-radius:14px;padding:16px 18px;font-size:14px;line-height:1.55;color:#5b6271;">
                  If you didn't create a KEYCON account, you can ignore this email.
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td align="center" style="padding:24px 16px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#ffffff;">
            KEYCON &middot; <a href="https://keyconapp.com" style="color:#ffffff;text-decoration:underline;">keyconapp.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
